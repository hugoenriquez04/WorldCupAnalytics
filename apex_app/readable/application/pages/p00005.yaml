    title: How can I help you?
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT 
          c001 AS User_name,
          c002 AS comment_text,
          c003 AS comment_date,
          CASE 
              WHEN c001 = 'USER' THEN 'chat-derecha'
              ELSE 'chat-izquierda'
          END AS COMMENT_MODIFIERS,
          NULL AS attribute_1,
          NULL AS attribute_2,
          NULL AS attribute_3,
          NULL AS attribute_4,
          NULL AS actions
      FROM apex_collections
      WHERE collection_name = 'CHAT_HISTORY'
      ORDER BY seq_id ASC;

