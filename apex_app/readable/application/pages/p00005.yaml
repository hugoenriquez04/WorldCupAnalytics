dynamic-actions: 
- # ====== Dynamic Action: Ejecución del PROMPT ================
  id: 9017841253843831
  identification: 
    name: Ejecución del PROMPT

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: Click
    selection-type: Button
    button: Submit # 11991152540820989

  actions: 
  - # ====== Action: PROMPT_EX ===================================
    id: 9017935826843832
    identification: 
      name: PROMPT_EX
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: |
        DECLARE
            v_respuesta CLOB;
            v_raw_sql CLOB;
            v_chart VARCHAR2(10) := 'NONE';
        BEGIN
            IF :5_PROMPT IS NOT NULL THEN
                
                -- Anadimos la intervención del usuario. 
                APEX_COLLECTION.ADD_MEMBER(
                    p_collection_name => 'CHAT_HISTORY',
                    p_c001            => 'USER',
                    p_c002            => :5_PROMPT,
                    p_c003            => TO_CHAR(SYSDATE, 'HH24:MI:SS')
                );
        
                -- Generamos una sentencia SQL que nos servira para el data report y las graficas
                v_raw_sql := F_PROMPT_SQL(:5_PROMPT);
        
                -- Guardamos el tipo de tabla generada.
                IF INSTR(v_raw_sql, '/*CHART:BAR*/') > 0 THEN
                    v_chart := 'BAR';
                    v_raw_sql := REPLACE(v_raw_sql, '/*CHART:BAR*/', '');
                ELSIF INSTR(v_raw_sql, '/*CHART:PIE*/') > 0 THEN
                    v_chart := 'PIE';
                    v_raw_sql := REPLACE(v_raw_sql, '/*CHART:PIE*/', '');
                ELSE
                    v_chart := 'Ninguna';
                END IF;
        
                -- Asignamos los valores finales a los ítems de página
                :5_SQL_GENERADO := RTRIM(TRIM(v_raw_sql), ';'); 
                :5_CHART_TYPE := v_chart;
                v_respuesta := F_PROMPT(:5_PROMPT);
        
                IF v_respuesta IS NULL THEN
                    v_respuesta := 'AVISO: La función se ejecutó, pero la IA ha devuelto un texto vacío (NULL).';
                END IF;
                
                -- Guardamos la respuesta de la IA
                APEX_COLLECTION.ADD_MEMBER(
                    p_collection_name => 'CHAT_HISTORY',
                    p_c001            => 'AI',
                    p_c002            => v_respuesta,
                    p_c003            => TO_CHAR(SYSDATE, 'HH24:MI:SS')
                );
        
            END IF;
        END;
      items-to-submit: 
      - 5_PROMPT
      items-to-return: 
      - 5_SQL_GENERADO
      - ' 5_CHART_TYPE'
      suppress-change-event: false

    execution: 
      sequence: 20
      event: Ejecución del PROMPT # 9017841253843831
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

