    - # ====== Series: Bar chart ===================================
      id: 12172783718454413
      identification: 
        name: Bar chart

      execution: 
        sequence: 10

      source: 
        location: Local Database
        type: Function Body returning SQL Query
        language: PL/SQL
        pl/sql-function-body-returning-sql-query: |
          DECLARE
              --Tomamos el SQL generado en el PROMPT EXEC
              v_sql CLOB := :5_SQL_GENERADO;
          BEGIN
              -- 1. Si no es un gráfico de barras, o el SQL está vacío, o no empieza por SELECT, salimos
              IF :5_CHART_TYPE != 'BAR' OR v_sql IS NULL OR UPPER(SUBSTR(TRIM(v_sql),1,6)) != 'SELECT' THEN
                  RETURN 'SELECT ''Sin datos'' AS LABEL, 0 AS VALUE FROM DUAL WHERE 1=2';
              END IF;
          
              -- 2. Si todo está bien, envolvemos y limpiamos el SQL para el gráfico
              RETURN 'SELECT LABEL, VALUE FROM (' || RTRIM(TRIM(v_sql), ';') || ')';
          END;
        page-items-to-submit: 
        - 5_SQL_GENERADO
        - ' 5_CHART_TYPE'

