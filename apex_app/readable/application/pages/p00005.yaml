  - # ====== Action: Scroll down =================================
    id: 9018781752843840
    identification: 
      name: Scroll down
      action: Execute JavaScript Code

    settings: 
      code: |
        // Le damos 100 milisegundos de margen para asegurar que el texto nuevo ya existe en la pantalla
        setTimeout(function() {
            // Apuntamos EXACTAMENTE a la caja interna que tiene el scroll
            var cajaChat = document.querySelector('#region-chat .t-Region-body');
            
            // Si la caja existe, bajamos el scroll a tope
            if (cajaChat) {
                cajaChat.scrollTop = cajaChat.scrollHeight;
            }
        }, 100);

