javascript: 
  execute-when-page-loads: |
    // ==========================================
    // 1. INICIALIZACIÓN PROTEGIDA
    // ==========================================
    $(document).ready(function() {
        var reubicarBotones = function() {
            var $prompt = $('#5_PROMPT');
            var $container = $prompt.closest('.t-Form-itemWrapper');
            var $btnNuevo = $('#btn-nuevo');
            var $btnSubmit = $('#mi-boton');
    
            if ($container.length && $btnNuevo.length && $btnSubmit.length) {
                $container.append($btnNuevo).append($btnSubmit);
            }
        };
    
        setTimeout(function() {
            reubicarBotones();
            limpiarTodo(); // Inicia la página limpia
    
            // Evento para el botón de RECARGA (Limpiar)
            $(document).on('click', '#btn-nuevo', function(e) {
                e.preventDefault();
                e.stopImmediatePropagation();
                limpiarTodo();
                return false;
            });
    
            // Evento para el botón ENVIAR
            $(document).on('click', '#mi-boton', function() {
                iniciarVisualesCarga();
            });
    
            // Ajuste automático de altura del textarea
            $('#5_PROMPT').on('input', function() {
                this.style.height = '52px';
                this.style.height = (this.scrollHeight) + 'px';
            });
        }, 500);
    });
    
    // ==========================================
    // 2. EVENTO ENTER (Enviar con teclado)
    // ==========================================
    $(document).off('keydown', '[id="5_PROMPT"]').on('keydown', '[id="5_PROMPT"]', function(e) {
        // Si pulsa Enter y NO tiene pulsado Shift
        if (e.which === 13 && !e.shiftKey) {
            e.preventDefault(); 
            $('#mi-boton').click();
        }
    });
    
    // ==========================================
    // 3. FUNCIÓN LIMPIAR (Resetear vista)
    // ==========================================
    function limpiarTodo() {
        // 1. Resetear el textarea
        $('#5_PROMPT').val('').css('height', '52px');
        
        // 2. Detener animaciones del botón si las hubiera
        $('#mi-boton').removeClass('balon-girando'); 
    }
    
    // ==========================================
    // 4. VISUALES DE CARGA 
    // ==========================================
    function iniciarVisualesCarga() {
        var val = $('#5_PROMPT').val().trim();
        if (val === '') return;
        
        // 1. Bloqueamos el botón y activamos el balón girando
        $('#mi-boton').css('pointer-events', 'none').css('opacity', '0.5');
        $('#mi-boton').addClass('balon-girando');
    }
    
    // ==========================================
    // 5. DETECTOR FINALIZACIÓN (Refresco de APEX)
    // ==========================================
    // Este evento salta automáticamente cuando APEX termina de ejecutar el PL/SQL y refrescar las regiones
    $(document).ajaxComplete(function(event, xhr, settings) {
        
        // 1. Restauramos el botón
        $('#mi-boton').css('pointer-events', 'auto').css('opacity', '1');
        $('#mi-boton').removeClass('balon-girando'); 
        
        // 2. Limpiamos el input para la siguiente pregunta
        $('#5_PROMPT').val('').css('height', '52px');
    
        // 3. Mostramos la tabla/gráfico si estaba oculta
        var $reporte = $('#reporte-sql');
        if ($reporte.length) {
            $reporte.removeClass('oculto-total');
            $reporte.css('display', 'block').show();
        }
        
        // 4. Scroll al fondo del chat para ver la respuesta de la IA
        var $chatBody = $('#region-chat .t-Region-body');
        if($chatBody.length) $chatBody[0].scrollTop = $chatBody[0].scrollHeight;
    });

css: 
  inline: |
    /*==========================================
       1. CÁPSULA Y TEXTAREA
    ========================================== */
    [id="5_PROMPT_CONTAINER"] .t-Form-itemWrapper {
        position: relative !important;
        display: flex !important;
        align-items: center !important;
        width: 100% !important;
    }
    
    textarea[id="5_PROMPT"] {
        min-height: 52px !important;
        border-radius: 26px !important;
        padding: 12px 100px 12px 20px !important; 
        width: 100% !important;
        box-sizing: border-box !important;
        background-color: #e3f2fd !important; 
        border: 1px solid #bbdefb !important;
        resize: none !important;
        line-height: 1.5 !important;
    }
    
    /* ==========================================
       2. BOTONES
       ========================================== */
    #btn-nuevo, #mi-boton {
        position: absolute !important;
        top: 50% !important;
        transform: translateY(-50%) !important;
        z-index: 999 !important;
        width: 36px !important;
        height: 36px !important;
        border-radius: 50% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        border: none !important;
        box-shadow: none !important;
    }
    
    #btn-nuevo { 
        right: 50px !important; 
        background-color: #e0e0e0 !important; 
    }
    
    #mi-boton { 
        right: 10px !important; 
        outline: none !important;
        background: transparent !important;
        cursor: pointer;
    }
    
    #mi-boton .t-Icon, #mi-boton img, #mi-boton .fa {
        margin: 0 !important;
        padding: 0 !important;
        line-height: 1 !important;
        display: block !important;
        color: #0071ce !important; 
        transition: color 0.3s ease !important;
    }
    
    #mi-boton:hover .t-Icon, #mi-boton:hover img, #mi-boton:hover .fa {
        color: #006400 !important; 
    }
    
    /* ==========================================
       3. ANIMACIÓN BALÓN GIRANDO
       ========================================== */
    #mi-boton.balon-girando .t-Icon, 
    #mi-boton.balon-girando img, 
    #mi-boton.balon-girando .fa {
        display: inline-block !important;
        animation: girar 0.8s linear infinite !important;
        transform-origin: center center !important;
    }
    
    @keyframes girar { 
        from { transform: rotate(0deg); } 
        to { transform: rotate(360deg); } 
    }
    
    
    
    /* ==========================================
      4. ESTILO DEL CHAT
       ========================================== */
    
    .t-Comments-icon, .t-Comments-userIcon, .u-Processing, .nodatafound { display: none !important; }
    
    .t-Comments-body::before, 
    .t-Comments-body::after {
        display: none !important;
    }
    
    .chat-derecha {
        display: flex !important;
        justify-content: flex-end !important;
        background: transparent !important;
        width: 100% !important;
    }
    
    /* Damos forma de burbuja al mensaje del USUARIO */
    .chat-derecha .t-Comments-body {
        background-color: #e0f7fa !important;
        border: none !important; 
        border-radius: 15px !important;
        border-bottom-right-radius: 0 !important; 
        padding: 12px 16px !important;
        max-width: 80% !important; 
        display: inline-block !important;
        box-shadow: 0 1px 2px rgba(0,0,0,0.15) !important;
    }
    
    /* Alineamos la fecha/nombre a la derecha */
    .chat-derecha .t-Comments-info {
        text-align: right !important;
        margin-bottom: 5px !important;
    }
    
    /* Repetimos la lógica pero hacia la izquierda y en blanco/gris */
    .chat-izquierda {
        display: flex !important;
        justify-content: flex-start !important;
        background: transparent !important;
        width: 100% !important;
    }
    
    .chat-izquierda .t-Comments-body {
        background-color: #fcfde2 !important;
        border: 1px solid #eee !important;
        border-radius: 15px !important;
        border-bottom-left-radius: 0 !important;
        padding: 12px 16px !important;
        max-width: 80% !important;
        display: inline-block !important;
        box-shadow: 0 1px 2px rgba(0,0,0,0.15) !important;
    }
    
    #region-chat .t-Region-body {
        background-color: #f8fbff !important; 
    }
    
    #region-chat {
        border: 1px solid #0b607c !important;
        border-radius: 4px !important;
    }
    
    
    /* ==========================================
       5. TÍTULO DEL DATA REPORT
       ========================================== */
    
    #reporte-sql .t-Region-title,
    #region-chat .t-Region-title,
    #region-chart .t-Region-title,
    #region-bar .t-Region-title {
        color: #ffffff !important;
        font-weight: 700 !important;
        font-size: 16px !important;
    }
    
    /* ==========================================
       6. CABECERA DE LAS REGIONES (HEADER)
       ========================================== */
    
    /* Cambiamos el fondo de la banda donde va el título */
    #region-chat .t-Region-header,
    #region-chart .t-Region-header,
    #region-bar .t-Region-header,
    #reporte-sql .t-Region-header {
        background-color: #0b607c !important; 
        border-bottom: none !important; 
    }
    
    
    /* ==========================================
       7. SCROLL INTERNO
       ========================================== */
    
    #region-chat {
        overflow: hidden !important; 
    }
    
    #region-chat .t-Region-body {
        height: 350px !important; 
        overflow-y: auto !important; 
        overflow-x: hidden !important;
        padding-right: 5px !important;
    }
    
    #region-chat .t-Region-body::-webkit-scrollbar {
        width: 6px;
    }
    #region-chat .t-Region-body::-webkit-scrollbar-track {
        background: transparent;
    }
    #region-chat .t-Region-body::-webkit-scrollbar-thumb {
        background-color: #cbd5e1; 
        border-radius: 10px;
    }
    

