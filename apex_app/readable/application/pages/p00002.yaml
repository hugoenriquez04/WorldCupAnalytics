    - # ====== Series: matches =====================================
      id: 9004904823060912
      identification: 
        name: matches

      execution: 
        sequence: 10

      source: 
        location: Local Database
        type: SQL Query
        sql-query: |
          SELECT 
              edicion, 
              COUNT(*) AS total_partidos
          FROM (
              SELECT REGEXP_SUBSTR(date_rw, '\d{4}') AS edicion
              FROM VW_COMPETITIVE_MATCHES
              WHERE date_rw IS NOT NULL
          )
          GROUP BY edicion
          ORDER BY edicion

      order-by: 
        type: None

      column-mapping: 
        label: EDICION
        value: TOTAL_PARTIDOS

      appearance: 
        color: '#8e8e93'
        assigned-to-y2-axis: false

      line: 
        type: Automatic

      marker: 
        show: Automatic
        shape: Automatic

      label: 
        show: false

      performance: 
        maximum-rows-to-process: 20

