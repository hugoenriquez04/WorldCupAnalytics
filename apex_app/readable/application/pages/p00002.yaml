- # ====== Region: Top Goalscorers =============================
  id: 9001385839060917
  identification: 
    name: Top Goalscorers
    type: Chart

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT g.scorer AS "Player", COUNT(*) AS "Goals"
      FROM goalscorers g 
          JOIN results r ON g.date_rw = r.date_rw AND g.home_team = r.home_team AND g.away_team = r.away_team
      WHERE r.tournament = 'FIFA World Cup' AND OWN_GOAL = 'FALSE'
      GROUP BY g.scorer
      ORDER BY "Goals" DESC

  order-by: 
    type: None

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
