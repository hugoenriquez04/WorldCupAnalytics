dynamic-actions: 
- # ====== Dynamic Action: Forzar Borrado de Chat ==============
  id: 12166307298498207
  identification: 
    name: Forzar Borrado de Chat

  execution: 
    sequence: 30
    event-scope: Static
    type: Immediate

  when: 
    event: Click
    selection-type: Button
    button: BTN_LIMPIAR_CHAT # 12160760597498236

  actions: 
  - # ====== Action: Borrar Memoria ==============================
    id: 12166834905498206
    identification: 
      name: Borrar Memoria
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: |
        BEGIN
            IF APEX_COLLECTION.COLLECTION_EXISTS('CHAT_HISTORY') THEN
            APEX_COLLECTION.TRUNCATE_COLLECTION('CHAT_HISTORY');
        END IF;
        END;

    execution: 
      sequence: 10
      event: Forzar Borrado de Chat # 12166307298498207
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

  - # ====== Action: Recarga la pantalla =========================
    id: 12167377722498205
    identification: 
      name: Recarga la pantalla
      action: Refresh

    settings: 
      maintain-pagination: false

    affected-elements: 
      selection-type: Region
      region: Lectura memoria chat # 21177868556342080

    execution: 
      sequence: 20
      event: Forzar Borrado de Chat # 12166307298498207
      fire-when-event-result-is: True
      fire-on-initialization: false

- # ====== Dynamic Action: SCROLL DOWN =========================
  id: 12167733851498205
  identification: 
    name: SCROLL DOWN

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: After Refresh
    selection-type: Region
    region: Lectura memoria chat # 21177868556342080

  actions: 
  - # ====== Action: Scroll down =================================
    id: 12168289718498205
    identification: 
      name: Scroll down
      action: Execute JavaScript Code

    settings: 
      code: |
        // Buscamos la caja que tiene el scroll (la clase que creamos en el paso anterior)
        var cajaChat = document.querySelector('.caja-chat-scroll');
        
        // Si la caja existe, movemos la barra del scroll hasta la altura total del contenido
        if (cajaChat) {
            cajaChat.scrollTop = cajaChat.scrollHeight;
        }
        
        

    execution: 
      sequence: 10
      event: SCROLL DOWN # 12167733851498205
      fire-when-event-result-is: True
      fire-on-initialization: true

- # ====== Dynamic Action: Ejecución del PROMPT ================
  id: 12168657979498205
  identification: 
    name: Ejecución del PROMPT

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: Click
    selection-type: Button
    button: Submit # 12161139937498232

  actions: 
  - # ====== Action: PROMPT_EX ===================================
    id: 12169195019498204
    identification: 
      name: PROMPT_EX
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: |
        DECLARE
            v_respuesta CLOB;
        BEGIN
            IF :1_PROMPT IS NOT NULL THEN
                
                -- 1. Guardamos la pregunta del USUARIO en la memoria del chat
                APEX_COLLECTION.ADD_MEMBER(
                    p_collection_name => 'CHAT_HISTORY',
                    p_c001            => 'USER',
                    p_c002            => :1_PROMPT,
                    p_c003            => TO_CHAR(SYSDATE, 'HH24:MI:SS')
                );
        
                -- 2. Llamamos a nuestra nueva función mágica
                v_respuesta := F_PROMPT(:1_PROMPT);
        
        
                IF v_respuesta IS NULL THEN
                    v_respuesta := '🟡 AVISO: La función se ejecutó, pero la IA ha devuelto un texto vacío (NULL).';
                END IF;
                
                -- 3. Guardamos la respuesta de la IA en la memoria del chat
                APEX_COLLECTION.ADD_MEMBER(
                    p_collection_name => 'CHAT_HISTORY',
                    p_c001            => 'AI',
                    p_c002            => v_respuesta,
                    p_c003            => TO_CHAR(SYSDATE, 'HH24:MI:SS')
                );
        
            END IF;
        END;
      items-to-submit: 
      - 1_PROMPT

    execution: 
      sequence: 10
      event: Ejecución del PROMPT # 12168657979498205
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

  - # ====== Action: REFRESH CHAT ================================
    id: 12169698974498204
    identification: 
      name: REFRESH CHAT
      action: Refresh

    settings: 
      maintain-pagination: false

    affected-elements: 
      selection-type: Region
      region: Lectura memoria chat # 21177868556342080

    execution: 
      sequence: 20
      event: Ejecución del PROMPT # 12168657979498205
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: CLEAR TEXT AREA =============================
    id: 12170154649498204
    identification: 
      name: CLEAR TEXT AREA
      action: Clear

    affected-elements: 
      selection-type: Item(s)
      item(s): 
      - 1_PROMPT

    execution: 
      sequence: 30
      event: Ejecución del PROMPT # 12168657979498205
      fire-when-event-result-is: True
      fire-on-initialization: false

processes: 
- # ====== Process: Crea colección/memoria chat ================
  id: 12165526904498209
  identification: 
    name: Crea colección/memoria chat
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      IF NOT APEX_COLLECTION.COLLECTION_EXISTS('CHAT_HISTORY') THEN
          APEX_COLLECTION.CREATE_COLLECTION('CHAT_HISTORY');
      END IF;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

- # ====== Process: Procesar Mensaje ===========================
  id: 12165967482498208
  identification: 
    name: Procesar Mensaje
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      BEGIN
          -- 1. Solo hacemos cosas si has escrito algo en el cajón
          IF :1_PROMPT IS NOT NULL THEN
              
              -- 2. Guardamos TU mensaje en la memoria del chat
              APEX_COLLECTION.ADD_MEMBER(
                  p_collection_name => 'CHAT_HISTORY',
                  p_c001            => 'Usuario', -- Tu nombre o avatar
                  p_c002            => :1_PROMPT, -- Lo que has escrito
                  p_c003            => TO_CHAR(SYSDATE, 'HH24:MI') -- La hora actual
              );
      
              -- 3. Simulamos una respuesta de la IA (hasta que conectemos OCI)
              APEX_COLLECTION.ADD_MEMBER(
                  p_collection_name => 'CHAT_HISTORY',
                  p_c001            => 'IA', -- Nombre de la IA
                  p_c002            => '¡Hola! Todavía no me has conectado al Mundial, pero te escucho perfectamente. Me has preguntado: "' || :P14_PROMPT || '"',
                  p_c003            => TO_CHAR(SYSDATE, 'HH24:MI')
              );
      
              -- 4. Borramos el texto del cajón para que puedas hacer otra pregunta
              :1_PROMPT := NULL;
              
          END IF;
      END;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: Submit # 12161139937498232

