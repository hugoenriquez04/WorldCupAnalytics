javascript: 
  execute-when-page-loads: |
    setTimeout(function() {
    var promptBox = document.querySelector('[id="1_PROMPT"]');
    var container = promptBox ? promptBox.closest('.t-Form-inputContainer') : null;
    var btnNuevo = document.getElementById('btn-nuevo');
    var btnSubmit = document.getElementById('mi-boton');
    if (container && btnNuevo && btnSubmit) {
    container.appendChild(btnNuevo);
    container.appendChild(btnSubmit);
    }
    if (promptBox) {
    var ajustar = function() {
    this.style.height = '52px';
    this.style.height = (this.scrollHeight) + 'px';
    };
    promptBox.addEventListener("input", ajustar);
    ajustar.call(promptBox);
    if(btnSubmit) {
    btnSubmit.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopImmediatePropagation();
    enviarMensajeApex();
    });
    }
    promptBox.addEventListener('keydown', function(e) {
    if(e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    e.stopImmediatePropagation();
    enviarMensajeApex();
    }
    });
    }
    }, 500);
    function enviarMensajeApex() {
    const input = document.getElementById('1_PROMPT');
    const chatBox = document.getElementById('chat-box');
    const btn = document.getElementById('mi-boton');
    const icono = btn.querySelector('.fa') || btn.querySelector('.t-Icon') || btn.querySelector('img') || btn;
    const texto = input.value.trim();
    if(texto === '' || !chatBox) return;
    chatBox.innerHTML += '<div class="message-wrapper wrapper-user"><div class="message message-user">' + texto + '</div></div>';
    input.value = '';
    input.style.height = '52px';
    icono.classList.add('balon-girando');
    btn.style.pointerEvents = 'none';
    const idEscribiendo = 'escribiendo-' + Date.now();
    chatBox.innerHTML += '<div class="message-wrapper wrapper-agent" id="' + idEscribiendo + '"><div class="message message-agent typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>';
    chatBox.scrollTop = chatBox.scrollHeight;
    setTimeout(() => {
    document.getElementById(idEscribiendo).remove();
    icono.classList.remove('balon-girando');
    btn.style.pointerEvents = 'auto';
    btn.classList.remove('is-processing', 'is-active');
    chatBox.innerHTML += '<div class="message-wrapper wrapper-agent"><div class="message message-agent">Consultando con Oracle Data Science y el modelo RandomForest...</div></div>';
    chatBox.scrollTop = chatBox.scrollHeight;
    }, 2500);
    }

css: 
  inline: |
    [id="1_PROMPT_CONTAINER"] .t-Form-itemWrapper{position:relative !important;display:flex !important;align-items:center !important;width:100% !important;}
    textarea[id="1_PROMPT"]{min-height:52px !important;border-radius:26px !important;padding:12px 100px 12px 20px !important;width:100% !important;box-sizing:border-box !important;background-color:#f9f9f9 !important;border:1px solid #ccc !important;resize:none !important;line-height:1.5 !important;}
    #btn-nuevo,#mi-boton{position:absolute !important;top:50% !important;transform:translateY(-50%) !important;z-index:999 !important;width:36px !important;height:36px !important;border-radius:50% !important;display:flex !important;align-items:center !important;justify-content:center !important;border:none !important;box-shadow:none !important;opacity:1 !important;}
    #btn-nuevo{right:50px !important;background-color:#e0e0e0 !important;}
    #mi-boton{right:10px !important;outline:none !important;background:none;cursor:pointer;}
    #mi-boton .t-Icon,#mi-boton img,#mi-boton .fa{margin:0 !important;padding:0 !important;line-height:1 !important;display:block !important;opacity:1 !important;color:#0071ce !important;}
    .balon-girando{display:inline-block !important;visibility:visible !important;opacity:1 !important;animation:girar 0.8s linear infinite !important;}
    @keyframes girar{100%{transform:rotate(360deg);}}
    #mi-boton.is-processing .t-Icon,#mi-boton.is-active .t-Icon,#mi-boton.is-processing .fa,#mi-boton.is-active .fa{display:inline-block !important;visibility:visible !important;opacity:1 !important;color:#0071ce !important;}
    #mi-boton.is-processing::after,#mi-boton.is-processing .t-Button-spinner{display:none !important;}
    .chat-container{display:flex;flex-direction:column;gap:15px;width:100%;font-family:sans-serif;padding:10px;height:500px;overflow-y:auto;margin-bottom:20px;}
    .message-wrapper{display:flex;width:100%;}
    .wrapper-user{justify-content:flex-end;}
    .wrapper-agent{justify-content:flex-start;}
    .message{max-width:85%;padding:12px 16px;border-radius:15px;font-size:14px;line-height:1.4;box-shadow:0 1px 2px rgba(0,0,0,0.15);}
    .message-user{background-color:#dcf8c6;border-bottom-right-radius:0;color:#000;}
    .message-agent{background-color:#ffffff;border-bottom-left-radius:0;color:#000;border:1px solid #eee;}
    .typing-indicator{display:flex;gap:4px;align-items:center;padding:5px 10px;}
    .dot{width:8px;height:8px;background-color:#999;border-radius:50%;animation:bounce 1.4s infinite ease-in-out both;}
    .dot:nth-child(1){animation-delay:-0.32s;}
    .dot:nth-child(2){animation-delay:-0.16s;}
    @keyframes bounce{0%,80%,100%{transform:scale(0);}40%{transform:scale(1);}}

