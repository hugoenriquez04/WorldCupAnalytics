- # ====== Dynamic Action: SCROLL DOWN =========================
  id: 12236513557220592
  identification: 
    name: SCROLL DOWN

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: After Refresh
    selection-type: Region
    region: Lectura memoria chat # 21238516759064454

  actions: 
  - # ====== Action: Scroll down =================================
    id: 12237053259220591
    identification: 
      name: Scroll down
      action: Execute JavaScript Code

    settings: 
      code: |
        // Buscamos la caja que tiene el scroll (la clase que creamos en el paso anterior)
        var cajaChat = document.querySelector('.caja-chat-scroll');
        
        // Si la caja existe, movemos la barra del scroll hasta la altura total del contenido
        if (cajaChat) {
            cajaChat.scrollTop = cajaChat.scrollHeight;
        }
        
        

    execution: 
      sequence: 10
      event: SCROLL DOWN # 12236513557220592
      fire-when-event-result-is: True
      fire-on-initialization: true

- # ====== Dynamic Action: Ejecución del PROMPT ================
  id: 12237432564220591
  identification: 
    name: Ejecución del PROMPT

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: Click
    selection-type: Button
    button: Submit # 12221841397220613

  actions: 
  - # ====== Action: PROMPT_EX ===================================
    id: 12237943201220591
    identification: 
      name: PROMPT_EX
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: |
        DECLARE
            v_respuesta CLOB;
        BEGIN
            IF :5_PROMPT IS NOT NULL THEN
                
                -- 1. [ALBERTO] Guardamos la pregunta del USUARIO
                APEX_COLLECTION.ADD_MEMBER(
                    p_collection_name => 'CHAT_HISTORY',
                    p_c001            => 'USER',
                    p_c002            => :5_PROMPT,
                    p_c003            => TO_CHAR(SYSDATE, 'HH24:MI:SS')
                );
        
                -- 2. [TU NUEVA LÍNEA] Generamos el SQL para el reporte
                -- Esta línea es la que hace que la tabla "sepa" qué mostrar
                :5_SQL_GENERADO := F_PROMPT_SQL(:5_PROMPT);
        
                -- 3. [ALBERTO] Llamamos a la función que narra el chat
                v_respuesta := F_PROMPT(:5_PROMPT);
        
                IF v_respuesta IS NULL THEN
                    v_respuesta := '🟡 AVISO: La función se ejecutó, pero la IA ha devuelto un texto vacío (NULL).';
                END IF;
                
                -- 4. [ALBERTO] Guardamos la respuesta de la IA
                APEX_COLLECTION.ADD_MEMBER(
                    p_collection_name => 'CHAT_HISTORY',
                    p_c001            => 'AI',
                    p_c002            => v_respuesta,
                    p_c003            => TO_CHAR(SYSDATE, 'HH24:MI:SS')
                );
        
            END IF;
        END;
      items-to-submit: 
      - 5_PROMPT
      items-to-return: 
      - 5_SQL_GENERADO
      suppress-change-event: false

    execution: 
      sequence: 20
      event: Ejecución del PROMPT # 12237432564220591
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

  - # ====== Action: REFRESH CHAT ================================
    id: 12238456925220591
    identification: 
      name: REFRESH CHAT
      action: Refresh

    settings: 
      maintain-pagination: false

    affected-elements: 
      selection-type: Region
      region: Lectura memoria chat # 21238516759064454

    execution: 
      sequence: 30
      event: Ejecución del PROMPT # 12237432564220591
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Refresh =====================================
    id: 12238980387220591
    identification: 
      name: Refresh
      action: Refresh

    settings: 
      maintain-pagination: false

    affected-elements: 
      selection-type: Region
      region: Data Report # 21405366189287668

    execution: 
      sequence: 50
      event: Ejecución del PROMPT # 12237432564220591
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: CLEAR TEXT AREA =============================
    id: 12239433016220590
    identification: 
      name: CLEAR TEXT AREA
      action: Clear

    affected-elements: 
      selection-type: Item(s)
