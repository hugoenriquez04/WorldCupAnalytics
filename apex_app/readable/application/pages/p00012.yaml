dynamic-actions: 
- # ====== Dynamic Action: Forzar Borrado de Chat ==============
  id: 12234154286220594
  identification: 
    name: Forzar Borrado de Chat

  execution: 
    sequence: 30
    event-scope: Static
    type: Immediate

  when: 
    event: Click
    selection-type: Button
    button: BTN_LIMPIAR_CHAT # 12221492989220616

  actions: 
  - # ====== Action: Borrar Memoria ==============================
    id: 12234672185220593
    identification: 
      name: Borrar Memoria
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: |
        BEGIN
            IF APEX_COLLECTION.COLLECTION_EXISTS('CHAT_HISTORY') THEN
            APEX_COLLECTION.TRUNCATE_COLLECTION('CHAT_HISTORY');
        END IF;
        END;

    execution: 
      sequence: 10
      event: Forzar Borrado de Chat # 12234154286220594
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

  - # ====== Action: Recarga la pantalla =========================
    id: 12235184950220592
    identification: 
      name: Recarga la pantalla
      action: Refresh

    settings: 
      maintain-pagination: false

    affected-elements: 
      selection-type: Region
      region: Lectura memoria chat # 21238516759064454

    execution: 
      sequence: 20
      event: Forzar Borrado de Chat # 12234154286220594
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Borrar Data Report ==========================
    id: 12235693759220592
    identification: 
      name: Borrar Data Report
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: ':5_SQL_GENERADO := NULL;'
      items-to-return: 
