javascript: 
  execute-when-page-loads: |
    // ==========================================
    // 1. INICIALIZACIÓN PROTEGIDA
    // ==========================================
    $(document).ready(function() {
        var reubicarBotones = function() {
            var $prompt = $('#5_PROMPT');
            var $container = $prompt.closest('.t-Form-itemWrapper');
            var $btnNuevo = $('#btn-nuevo');
            var $btnSubmit = $('#mi-boton');
    
            if ($container.length && $btnNuevo.length && $btnSubmit.length) {
                $container.append($btnNuevo).append($btnSubmit);
            }
        };
    
        setTimeout(function() {
            reubicarBotones();
            limpiarTodo(); // Inicia la página limpia
    
            // Evento para el botón de RECARGA (Gris)
            $(document).on('click', '#btn-nuevo', function(e) {
                e.preventDefault();
                e.stopImmediatePropagation();
                limpiarTodo();
                return false;
            });
    
            // Evento para el botón ENVIAR (Balón)
            $(document).on('click', '#mi-boton', function() {
                iniciarVisualesCarga();
            });
    
            // Ajuste de altura del textarea
            $('#5_PROMPT').on('input', function() {
                this.style.height = '52px';
                this.style.height = (this.scrollHeight) + 'px';
            });
        }, 500);
    });
    
    // ==========================================
    // 2. EVENTO ENTER
    // ==========================================
    $(document).off('keydown', '[id="5_PROMPT"]').on('keydown', '[id="5_PROMPT"]', function(e) {
        if (e.which === 13 && !e.shiftKey) {
            e.preventDefault(); 
            $('#mi-boton').click();
        }
    });
    
    // ==========================================
    // 3. FUNCIÓN LIMPIAR (REFORZADA CONTRA REBOTES)
    // ==========================================
    function limpiarTodo() {
        // 1. Limpiar campos
        $('#5_PROMPT').val('').css('height', '52px');
        $('#chat-box').empty();
        $('.message-wrapper').remove(); 
        $('#mi-boton').removeClass('balon-girando'); // <--- NUEVO: Por si acaso, paramos el balón al limpiar
        
    }
    
    // ==========================================
    // 4. VISUALES DE CARGA
    // ==========================================
    function iniciarVisualesCarga() {
        var val = $('#5_PROMPT').val().trim();
        if (val === '') return;
    
        $('#chat-box').append('<div class="message-wrapper wrapper-user"><div class="message message-user">'+val+'</div></div>');
        $('#chat-box').append('<div class="message-wrapper wrapper-agent" id="loading-dots"><div class="message message-agent typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>');
        
        $('#mi-boton').css('pointer-events', 'none').css('opacity', '0.5');
        $('#mi-boton').addClass('balon-girando'); // <--- NUEVO: Ponemos a girar el balón
        
        // El reporte se mantiene oculto hasta que el AJAX complete
        var cb = document.getElementById('chat-box');
        if(cb) cb.scrollTop = cb.scrollHeight;
    }
    
    // ==========================================
    // 5. DETECTOR FINALIZACIÓN (MOSTRAR REPORTE) - REFORZADO
    // ==========================================
    $(document).ajaxComplete(function(event, xhr, settings) {
        // 1. Quitar indicadores de carga y restaurar botón
        $('#loading-dots').remove();
        $('#mi-boton').css('pointer-events', 'auto').css('opacity', '1');
        $('#mi-boton').removeClass('balon-girando'); // <--- NUEVO: Paramos el balón al terminar
        
        // 2. Limpiar el campo de texto (ahora que ya se procesó)
        $('#5_PROMPT').val('').css('height', '52px');
    
        // 3. MOSTRAR EL REPORTE (Sin condiciones de conteo)
        var $reporte = $('#reporte-sql');
        if ($reporte.length) {
            $reporte.removeClass('oculto-total');
            // Usamos .show() y forzamos el display block por si acaso
            $reporte.css('display', 'block').show();
        }
        
        // 4. Scroll al fondo del chat
        var cb = document.getElementById('chat-box');
        if(cb) cb.scrollTop = cb.scrollHeight;
    });

css: 
  inline: |
    /*==========================================
       1. CÁPSULA Y TEXTAREA
    ========================================== */
    [id="5_PROMPT_CONTAINER"] .t-Form-itemWrapper {
        position: relative !important;
        display: flex !important;
        align-items: center !important;
        width: 100% !important;
    }
    
    textarea[id="5_PROMPT"] {
        min-height: 52px !important;
        border-radius: 26px !important;
        padding: 12px 100px 12px 20px !important; 
        width: 100% !important;
        box-sizing: border-box !important;
        background-color: #f9f9f9 !important;
        border: 1px solid #ccc !important;
        resize: none !important;
        line-height: 1.5 !important;
    }
    
    /* ==========================================
       2. BOTONES (NUEVO Y ENVIAR)
       ========================================== */
    #btn-nuevo, #mi-boton {
        position: absolute !important;
        top: 50% !important;
        transform: translateY(-50%) !important;
        z-index: 999 !important;
        width: 36px !important;
        height: 36px !important;
        border-radius: 50% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        border: none !important;
        box-shadow: none !important;
    }
    
    #btn-nuevo { 
        right: 50px !important; 
        background-color: #e0e0e0 !important; 
    }
    
    #mi-boton { 
        right: 10px !important; 
        outline: none !important;
        background: transparent !important;
        cursor: pointer;
    }
    
    #mi-boton .t-Icon, #mi-boton img, #mi-boton .fa {
        margin: 0 !important;
        padding: 0 !important;
        line-height: 1 !important;
        display: block !important;
        color: #0071ce !important; 
        transition: color 0.3s ease !important;
    }
    
    #mi-boton:hover .t-Icon, #mi-boton:hover img, #mi-boton:hover .fa {
        color: #006400 !important; 
    }
    
    /* ==========================================
       3. ANIMACIÓN BALÓN GIRANDO (MANUAL)
       ========================================== */
    #mi-boton.balon-girando .t-Icon, 
    #mi-boton.balon-girando img, 
    #mi-boton.balon-girando .fa {
        display: inline-block !important;
        animation: girar 0.8s linear infinite !important;
        transform-origin: center center !important;
    }
    
    @keyframes girar { 
        from { transform: rotate(0deg); } 
        to { transform: rotate(360deg); } 
    }
    
    /* ==========================================
       4. CHAT Y BURBUJAS
       ========================================== */
    .chat-container { 
        display: flex; 
        flex-direction: column; 
        gap: 15px; 
        width: 100%; 
        font-family: sans-serif; 
        padding: 10px; 
        height: 500px; 
        overflow-y: auto; 
        margin-bottom: 20px; 
    }
    
    .message-wrapper { display: flex; width: 100%; }
    .wrapper-user { justify-content: flex-end; }
    .wrapper-agent { justify-content: flex-start; }
    
    .message { 
        max-width: 85%; 
        padding: 12px 16px; 
        border-radius: 15px; 
        font-size: 14px; 
        line-height: 1.4; 
        box-shadow: 0 1px 2px rgba(0,0,0,0.15); 
        white-space: pre-wrap !important; 
    }
    
    .message-user { background-color: #dcf8c6; border-bottom-right-radius: 0; color: #000; }
    .message-agent { background-color: #ffffff; border-bottom-left-radius: 0; color: #000; border: 1px solid #eee; }
    
    /* Indicador de carga (puntos) */
    .typing-indicator { display: flex; gap: 4px; align-items: center; padding: 5px 10px; }
    .dot { width: 8px; height: 8px; background-color: #999; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    
    /* Ocultar elementos nativos molestos */
    .t-Comments-icon, .t-Comments-userIcon, .u-Processing, .nodatafound { display: none !important; }
    
    /* ==========================================
       COLOR VERDE Y ALINEACIÓN (ESTILO BURBUJA)
       ========================================== */
    
    /* 1. Quitamos los "picos" grises que dibuja APEX por defecto */
    .t-Comments-body::before, 
    .t-Comments-body::after {
        display: none !important;
    }
    
    /* 2. Convertimos la fila en Flexbox para empujar la burbuja a la derecha */
    .chat-derecha {
        display: flex !important;
        justify-content: flex-end !important; /* Empuja todo a la derecha */
        background: transparent !important;
        width: 100% !important;
    }
    
    /* 3. Damos forma de burbuja al mensaje del USUARIO (Verde) */
    .chat-derecha .t-Comments-body {
        background-color: #e0f7fa !important; /* Todo del mismo verde claro */
        border: none !important; /* Sin bordes grises feos */
        border-radius: 15px !important;
        border-bottom-right-radius: 0 !important; /* Forma de burbuja */
        padding: 12px 16px !important;
        max-width: 80% !important; /* Para que textos muy largos no ocupen toda la pantalla */
        display: inline-block !important; /* Se encoge al tamaño del texto */
        box-shadow: 0 1px 2px rgba(0,0,0,0.15) !important;
    }
    
    /* 4. Alineamos la fecha/nombre (USER - 12:04:26) a la derecha */
    .chat-derecha .t-Comments-info {
        text-align: right !important;
        margin-bottom: 5px !important;
    }
    
    /* ==========================================
       FORMA DE BURBUJA PARA LA IA (IZQUIERDA)
       ========================================== */
    
    /* Repetimos la lógica pero hacia la izquierda y en blanco/gris */
    .chat-izquierda {
        display: flex !important;
        justify-content: flex-start !important; /* Se queda a la izquierda */
        background: transparent !important;
        width: 100% !important;
    }
    
    .chat-izquierda .t-Comments-body {
        background-color: #ffffff !important;
        border: 1px solid #eee !important;
        border-radius: 15px !important;
        border-bottom-left-radius: 0 !important;
        padding: 12px 16px !important;
        max-width: 80% !important;
        display: inline-block !important;
        box-shadow: 0 1px 2px rgba(0,0,0,0.15) !important;
    }
    
    
    /* ==========================================
       5. TÍTULO DEL DATA REPORT
       ========================================== */
    #reporte-sql .t-Region-title {
        color: #0277bd !important; /* Azul petróleo oscuro para hacer juego con el menú */
        font-weight: 700 !important; /* Lo hacemos un poquito más "gordito" (negrita) para que destaque */
        font-size: 16px !important; /* Tamaño opcional, por si lo quieres más grande */
    }
    
    /* Título de la Región de Chat */
    #region-chat .t-Region-title {
        color: #0277bd !important; /* El mismo azul petróleo oscuro */
        font-weight: 700 !important;
        font-size: 16px !important;
    }
    
    /* ==========================================
       6. CABECERA DE LAS REGIONES (HEADER)
       ========================================== */
    
    /* Cambiamos el fondo de la banda donde va el título */
    #region-chat .t-Region-header,
    #reporte-sql .t-Region-header {
        background-color: #f0f9fa !important; /* Un azul cian debilísimo para el fondo de la banda */
        border-bottom: 2px solid #00838f !important; /* Una línea fina abajo del color del título */
    }
    
    /* Aseguramos que el título se vea perfecto sobre ese fondo */
    #region-chat .t-Region-title,
    #reporte-sql .t-Region-title {
        color: #00838f !important;
        font-weight: 700 !important;
    }

