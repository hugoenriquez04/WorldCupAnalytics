- # ====== Region: Buscador eliminatorias ======================
  id: 12212338710616545
  identification: 
    name: Buscador eliminatorias
    title: 'Search for the exact result (knockout stage matches only):'
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT 
          ROUND,
          HOME_TEAM,
          AWAY_TEAM,
          WINNER,
          CASE 
              WHEN METHOD = 'REGULAR TIME' THEN 'Regular Time'
              WHEN METHOD = 'MENTAL STRENGTH' THEN 'Penalties (PK)'
              ELSE METHOD 
          END AS WINNING_METHOD
      FROM KNOCKOUT_PREDICTIONS
      ORDER BY 
          CASE ROUND
              WHEN 'Round of 32' THEN 1
              WHEN 'Round of 16' THEN 2
              WHEN 'Quarter-Finals' THEN 3
              WHEN 'Semi-Finals' THEN 4
              WHEN 'Final' THEN 5
              ELSE 6
          END ASC

