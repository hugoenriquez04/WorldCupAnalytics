      SELECT 
          GROUP_ID AS "GROUP",
          DATE_RW AS MATCH_DATE,
          HOME_TEAM,
          AWAY_TEAM,
          ROUND(PREDICCION_NUMERICA, 2) AS GOAL_DIFFERENCE,
