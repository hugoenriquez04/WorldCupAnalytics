- # ====== Region: Groups ======================================
  id: 12209326912616515
  identification: 
    name: Groups
    title: Group Stage
    type: Dynamic Content

  source: 
    language: PL/SQL
    pl/sql-function-body-returning-a-clob: |
      DECLARE
          -- Definimos la variable CLOB que contendrá todo el HTML
          v_html       CLOB; 
          v_posicion   NUMBER;
          
          -- Colores
          v_bg_general VARCHAR2(50) := '#001520';
          v_card_bg    VARCHAR2(50) := '#003a4d';
          v_border     VARCHAR2(50) := '#00838f';
          v_accent     VARCHAR2(50) := '#FFD700';
      
          CURSOR c_grupos IS
              SELECT DISTINCT GROUP_ID FROM GROUP_STAGE_PREDICTIONS ORDER BY GROUP_ID;
      
          CURSOR c_equipos(p_grupo VARCHAR2) IS
              WITH Partidos_Desdoblados AS (
                  SELECT GROUP_ID, HOME_TEAM as EQUIPO,
                      CASE WHEN PREDICCION_NUMERICA > 0.5 THEN 3 
                           WHEN PREDICCION_NUMERICA BETWEEN -0.5 AND 0.5 THEN 1 ELSE 0 END as PUNTOS
                  FROM GROUP_STAGE_PREDICTIONS WHERE GROUP_ID = p_grupo
                  UNION ALL
                  SELECT GROUP_ID, AWAY_TEAM as EQUIPO,
                      CASE WHEN PREDICCION_NUMERICA < -0.5 THEN 3 
                           WHEN PREDICCION_NUMERICA BETWEEN -0.5 AND 0.5 THEN 1 ELSE 0 END as PUNTOS
                  FROM GROUP_STAGE_PREDICTIONS WHERE GROUP_ID = p_grupo
              )
              SELECT EQUIPO, SUM(PUNTOS) as PUNTOS_TOTALES
              FROM Partidos_Desdoblados
              GROUP BY EQUIPO
              ORDER BY PUNTOS_TOTALES DESC;
      
      BEGIN
          -- Inicializamos el CLOB
          DBMS_LOB.CREATETEMPORARY(v_html, FALSE);
      
          -- Empezamos a concatenar el HTML en la variable v_html
          v_html := '<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 20px; background: ' || v_bg_general || '; border-radius: 12px; min-width: 900px;">';
          
          FOR r_grupo IN c_grupos LOOP
              v_html := v_html || '<div style="background: ' || v_card_bg || '; border: 1px solid ' || v_border || '; border-radius: 8px; padding: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.3);">';
              v_html := v_html || '<h3 style="color: ' || v_accent || '; margin-top: 0; margin-bottom: 12px; text-align: center; border-bottom: 1px solid ' || v_border || '; padding-bottom: 8px;">GROUP ' || r_grupo.GROUP_ID || '</h3>';
              v_html := v_html || '<table style="width: 100%; color: #ffffff; border-collapse: collapse; font-family: sans-serif; font-size: 14px;">';
              v_html := v_html || '<thead><tr style="color: #a09eb5; text-align: left; border-bottom: 1px solid #004f68;">';
              v_html := v_html || '<th style="padding: 6px 4px; width: 20px;">#</th><th style="padding: 6px 4px;">National Team</th><th style="padding: 6px 4px; text-align: center;">Pts</th>';
              v_html := v_html || '</tr></thead><tbody>';
              
              v_posicion := 1;
              FOR r_equipo IN c_equipos(r_grupo.GROUP_ID) LOOP
                  v_html := v_html || '<tr style="' || CASE WHEN v_posicion <= 2 THEN 'font-weight: bold; color: #ffffff;' ELSE 'color: #cbd5e1;' END || ' border-bottom: 1px solid rgba(0,131,143,0.3);">';
                  v_html := v_html || '<td style="padding: 8px 4px;">' || v_posicion || '</td>';
                  v_html := v_html || '<td style="padding: 8px 4px;">' || r_equipo.EQUIPO || '</td>';
                  v_html := v_html || '<td style="padding: 8px 4px; text-align: center; color: ' || v_accent || ';">' || r_equipo.PUNTOS_TOTALES || '</td>';
                  v_html := v_html || '</tr>';
                  v_posicion := v_posicion + 1;
              END LOOP;
              
              v_html := v_html || '</tbody></table></div>'; 
          END LOOP;
          
          v_html := v_html || '</div>';
      
          -- FINALMENTE: Devolvemos el CLOB generado
          RETURN v_html;
      END;

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

