javascript: 
  execute-when-page-loads: |
    setTimeout(function() {
        var promptBox = document.querySelector('[id="1_PROMPT"]');
        var container = promptBox ? promptBox.closest('.t-Form-inputContainer') : null;
        var btnNuevo = document.getElementById('btn-nuevo');
        var btnSubmit = document.getElementById('mi-boton');
    
        if (container && btnNuevo && btnSubmit) {
            container.appendChild(btnNuevo);
            container.appendChild(btnSubmit);
        }
    
        if (promptBox) {
            // Función para ajustar la altura según el contenido
            var ajustar = function() {
                this.style.height = '52px'; // Reset inicial
                this.style.height = (this.scrollHeight) + 'px';
            };
            promptBox.addEventListener("input", ajustar);
            ajustar.call(promptBox);
        }
    }, 500);

css: 
  inline: |
    /* 1. EL CONTENEDOR (Lo convertimos en jefe de alineación) */
    [id="1_PROMPT_CONTAINER"] .t-Form-itemWrapper {
        position: relative !important;
        display: flex !important;
        align-items: center !important; /* Centrado vertical real */
        width: 100% !important;
    }
    
    /* 2. LA CÁPSULA */
    textarea[id="1_PROMPT"] {
        min-height: 52px !important;
        border-radius: 26px !important;
        padding: 12px 100px 12px 20px !important; 
        width: 100% !important;
        box-sizing: border-box !important;
        background-color: #f9f9f9 !important;
        border: 1px solid #ccc !important;
        resize: none !important;
        line-height: 1.5 !important;
    }
    
    /* 3. BOTONES (Usando Flex para centrado interno también) */
    #btn-nuevo, #mi-boton {
        position: absolute !important;
        top: 50% !important;
        transform: translateY(-50%) !important; /* Centrado vertical respecto al contenedor */
        z-index: 999 !important;
        width: 36px !important;
        height: 36px !important;
        border-radius: 50% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        border: none !important;
        box-shadow: none !important; /* Quitamos sombras que puedan falsear la vista */
    }
    
    #btn-nuevo { 
        right: 50px !important; 
        background-color: #e0e0e0 !important; 
    }
    
    #mi-boton { 
        right: 10px !important; 
        /* Forzamos que no tenga bordes extra que lo muevan */
        outline: none !important;
    }
    
    /* 4. CORRECCIÓN DEL ICONO DEL BALÓN */
    #mi-boton .t-Icon, #mi-boton img {
        margin: 0 !important;
        padding: 0 !important;
        line-height: 1 !important;
        display: block !important;
    }
    
    

